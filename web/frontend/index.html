<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bosch-lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script>try { const t = localStorage.getItem("bosch-lab:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <div class="brand"><div class="logo">bl</div><div><b>bosch-lab</b><small id="brandSub">C++ &amp; Linux System prep</small></div><button class="theme-btn" id="themeBtn" type="button"></button></div>
      <input type="search" class="search-input" id="searchBox" placeholder="Search labs, theory, quiz…   /" autocomplete="off" spellcheck="false" aria-label="Search">
      <div class="modes" id="modes"></div>
      <div class="progress"><div id="bar"></div></div>
      <div class="stats" id="stats"></div>
      <div class="filters" id="filters"></div>
    </header>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<button class="dock-toggle" id="dockToggle" title="Terminal 2 (bash in the bosch-lab directory)">▸ Terminal 2</button>
<div class="dock" id="dock" hidden>
  <div class="bar"><span>Terminal 2 — bash</span><span class="muted" id="dockHint">for ps, kill, running a second program…</span><span class="sp"></span><button class="small" id="dockHide">Minimize</button></div>
  <div class="term" id="dockTerm"></div>
</div>

<!-- ES modules: main.js imports the others (see web/README.md) -->
<script type="module" src="/js/main.js"></script>
</body>
</html>
